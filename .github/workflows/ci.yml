 name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CyberBot_Part2/CyberBot_Part2.csproj

      - name: Build
        run: dotnet build CyberBot_Part2/CyberBot_Part2.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish (artifact)
        run: |
          dotnet publish CyberBot_Part2/CyberBot_Part2.csproj -c Release -r win-x64 --self-contained false -o ./artifacts --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberBot_Part2
          path: ./artifacts
