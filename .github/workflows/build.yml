name: CyberBot Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CyberBot_Part2/CyberBot_Part2.csproj

    - name: Build project
      run: dotnet build CyberBot_Part2/CyberBot_Part2.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish CyberBot_Part2/CyberBot_Part2.csproj --configuration Release --output ./publish
